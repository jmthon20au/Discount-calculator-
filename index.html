<!DOCTYPE html><html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>حاسبة الخصم</title>
  <style>
    body{
      font-family:"Tajawal",sans-serif;
      background:#0d0d0d;
      margin:0;
      padding:20px;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#fff;
    }.card{
  width:100%;
  max-width:420px;
  margin:0 auto;
  background:#141414;
  border-radius:18px;
  padding:22px;
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
  animation:fadeIn .5s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(15px);} to{opacity:1; transform:translateY(0);}
}

h2{text-align:center; margin-bottom:18px; font-size:24px;}

label{color:#ccc; font-size:15px;}

.input-group{position:relative; margin-top:8px;}

input{
  width:80%; 
  padding:13px 42px 13px 12px;
  background:#0f0f0f; 
  border:1px solid #222;
  border-radius:14px; 
  color:#fff; 
  font-size:17px;
  direction:ltr;
}

.icon{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  width:36px; height:36px; display:flex; justify-content:center; align-items:center;
  border-radius:10px; background:#1e1e1e; box-shadow:0 3px 10px rgba(0,0,0,0.6);
}
.icon svg{width:18px;height:18px;opacity:.9;color:#4da3ff}

/* النص أسفل الحقل */
.text-under{
  margin-top:6px;
  font-size:15px;
  color:#e8e8e8;
  min-height:20px;
  opacity:.9;
  direction:rtl;
  text-align:right;
}

button{
  width:100%; margin-top:15px; padding:14px;
  background:#3b82f6; border:none; border-radius:14px;
  color:#fff; font-size:18px; cursor:pointer;
  transition:.2s;
}
button:hover{transform:translateY(-2px);}

.result{
  background:#0f0f0f;
  border:1px solid #333;
  padding:16px; margin-top:20px;
  border-radius:14px;
  display:none;
}
.result p{font-size:17px; margin:8px 0;}
.copy-btn{background:#16c47f; margin-top:12px;}

.footer{text-align:center; margin-top:18px; color:#999; font-size:13px; line-height:1.5}

/* Responsive */
@media (max-width:450px){
  .card{padding:16px; max-width:360px;}
  input{font-size:15px; padding:11px 38px 11px 10px;}
  .icon{width:26px;height:26px;}
}
  .icon{width:28px;height:28px;}
  .card{padding:18px;}
}
  .icon{width:30px;height:30px;}
}

  </style>
</head>
<body>  <div class="card">
    <h2>🔥 حاسبة الخصم المميزة</h2><label>💵 المبلغ الأصلي</label>
<div class="input-group">
  <input type="text" id="price" placeholder="أدخل المبلغ" oninput="onPriceInput(this)">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3v4"></path></svg></div>
</div>
<div class="text-under" id="priceWords"></div>

<label>🎯 نسبة الخصم (%)</label>
<div class="input-group">
  <input type="number" id="discount" placeholder="مثال: 20">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 5L5 19"></path><circle cx="6.5" cy="6.5" r="1.5"></circle><circle cx="17.5" cy="17.5" r="1.5"></circle></svg></div>
</div>

<button onclick="calcDiscount()">✅ احسب الخصم</button>

<div class="result" id="resultBox">
  <p>💰 السعر السابق: <span id="oldPrice"></span></p>
  <p>🏷️ نسبة الخصم: <span id="discPercent"></span>%</p>
  <p>✅ السعر بعد الخصم: <span id="newPrice"></span></p>
  <p>🎉 التوفير: <span id="saved"></span></p>
  <button class="copy-btn" onclick="copyResult()">📋 نسخ النتيجة</button>
</div>

<div class="footer">
  🤍 تلجرام : @altaee_z <br>
  🌐 موقعي : www.ali-Altaee.free.nf
</div>

  </div><script>
// ✅ تنسيق الأرقام بنظام 1.500.000
function normalizeNumber(n){ return Number(String(n).replace(/\./g,'')); }
function formatDots(n){ return Number(n).toLocaleString('de-DE'); }

// ✅ تحويل الأرقام إلى نص عربي فصيح رسمي
function numberToArabicWords(num){
  num = Math.floor(Number(num));
  if(isNaN(num)||num===0) return "صفر";

  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
  const teens=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];

  function belowThousand(n){
    let out=[];
    if(n>=100){ let h=Math.floor(n/100); out.push(hundreds[h]); n%=100; }
    if(n>=20){ let t=Math.floor(n/10); out.push(tens[t]); let o=n%10; if(o) out.push(ones[o]); }
    else if(n>=10) out.push(teens[n-10]);
    else if(n>0) out.push(ones[n]);
    return out.filter(Boolean).join(' و ');
  }

  let parts=[];
  const billion=Math.floor(num/1_000_000_000);
  if(billion>0) parts.push(billion===1?'مليار':billion===2?'ملياران':belowThousand(billion)+' مليار');
  num%=1_000_000_000;

  const million=Math.floor(num/1_000_000);
  if(million>0) parts.push(million===1?'مليون':million===2?'مليونان':belowThousand(million)+' مليون');
  num%=1_000_000;

  const thousand=Math.floor(num/1000);
  if(thousand>0) parts.push(thousand===1?'ألف':thousand===2?'ألفان':belowThousand(thousand)+' ألف');
  num%=1000;

  if(num>0) parts.push(belowThousand(num));

  return parts.join(' و ');
}

// ✅ عند كتابة الرقم
function onPriceInput(el){
  let raw = el.value.replace(/[^0-9]/g,'');
  let formatted = formatDots(raw);
  el.value = formatted;

  document.getElementById('priceWords').innerText = raw? numberToArabicWords(raw) : '';
}

// ✅ زر حساب الخصم
function calcDiscount(){
  let priceRaw = document.getElementById('price').value.replace(/\./g,'');
  let price = Number(priceRaw);
  let discount = Number(document.getElementById('discount').value);

  if(!price || !discount){ alert("يرجى إدخال المبلغ والخصم بشكل صحيح"); return; }

  let saved = price * (discount/100);
  let newPrice = price - saved;

  document.getElementById('oldPrice').innerText = formatDots(price);
  document.getElementById('discPercent').innerText = discount;
  document.getElementById('newPrice').innerText = formatDots(newPrice.toFixed(0));
  document.getElementById('saved').innerText = formatDots(saved.toFixed(0));

  document.getElementById('resultBox').style.display = 'block';
}

// ✅ زر نسخ
function copyResult(){
  let t = `السعر السابق: ${document.getElementById('oldPrice').innerText}
`+
          `نسبة الخصم: ${document.getElementById('discPercent').innerText}%
`+
          `السعر بعد الخصم: ${document.getElementById('newPrice').innerText}
`+
          `التوفير: ${document.getElementById('saved').innerText}

`+
          `🤍 تلجرام: @altaee_z
🌐 موقعي: www.ali-Altaee.free.nf`;
  navigator.clipboard.writeText(t);
  alert("✅ تم نسخ النتيجة");
}
</script></body>
  </html>
